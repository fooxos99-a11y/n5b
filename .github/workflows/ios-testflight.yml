name: Nukhba Expo Preview TestFlight

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload only the separately identified Expo preview
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nukhab-expo-preview
  cancel-in-progress: false

jobs:
  ios:
    if: github.ref == 'refs/heads/codex/nukhab-expo-preview-testflight'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_DOTENV: '1'
      NUKHAB_APP_VARIANT: testflight-preview
      NUKHAB_BUILD_NUMBER: ${{ github.run_number }}
      EXPO_PUBLIC_API_BASE_URL: https://nokhab.cc/n5b-expo-preview/api
      EXPO_PUBLIC_REGISTRATION_NUMBER: expo-preview
      EXPO_PUBLIC_NATIVE_PROBES: '0'
      APPSTORE_API_KEY_ID: W57M846854
      APPSTORE_ISSUER_ID: f8699d66-10db-4ef1-baec-dc481005ca60
      APPLE_TEAM_ID: N3VFH76QCU
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install Expo dependencies
        working-directory: mobile
        run: npm ci
      - name: Check types, lint and behavior
        working-directory: mobile
        run: npm run typecheck && npm run lint && npm test
      - name: Report dependency audit
        working-directory: mobile
        continue-on-error: true
        run: npm run audit
      - name: Verify preview service before publishing
        if: ${{ inputs.publish }}
        run: |
          curl --fail --silent --show-error --max-time 30 \
            https://nokhab.cc/n5b-expo-preview/api/health
      - name: Import existing distribution certificate
        uses: apple-actions/import-codesign-certs@7abe6dfe88f6bf6b1fa06e6a5704a2605d897418 # v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
      - name: Prepare separate preview identifier and profile
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          python3 -m venv "$RUNNER_TEMP/preview-signing"
          "$RUNNER_TEMP/preview-signing/bin/pip" install --quiet PyJWT cryptography
          "$RUNNER_TEMP/preview-signing/bin/python" scripts/prepare-expo-preview-profile.py
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APPSTORE_API_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
      - name: Generate native Expo iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install && npx pod-install ios
      - name: Configure application signing
        working-directory: mobile
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open(Dir['ios/*.xcodeproj'].fetch(0))
          targets = project.targets.select { |target| target.product_type == 'com.apple.product-type.application' }
          raise 'Expected one application' unless targets.length == 1
          targets.first.build_configurations.each do |config|
            settings = config.build_settings
            raise 'Wrong bundle identifier' unless settings['PRODUCT_BUNDLE_IDENTIFIER'] == 'sa.nukhab.app.preview'
            settings['CODE_SIGN_STYLE'] = 'Manual'
            settings['DEVELOPMENT_TEAM'] = ENV.fetch('APPLE_TEAM_ID')
            settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('PREVIEW_PROFILE')
          end
          project.save
          File.open(ENV.fetch('GITHUB_ENV'), 'a') { |file| file.puts "PREVIEW_SCHEME=#{targets.first.name}" }
          RUBY
      - name: Archive native Release application
        working-directory: mobile
        run: |
          set -o pipefail
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          xcodebuild -workspace "$workspace" -scheme "$PREVIEW_SCHEME" \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/NukhabPreview.xcarchive" archive \
            | tee "$RUNNER_TEMP/preview-archive.log" | tail -n 80
      - name: Verify identity and export options
        run: |
          python3 <<'PY'
          import glob, os, plistlib
          root = os.environ['RUNNER_TEMP']
          apps = glob.glob(root + '/NukhabPreview.xcarchive/Products/Applications/*.app')
          assert len(apps) == 1
          with open(apps[0] + '/Info.plist', 'rb') as source:
              info = plistlib.load(source)
          assert info['CFBundleIdentifier'] == 'sa.nukhab.app.preview'
          assert info['CFBundleDisplayName'] == 'نخب تجريبي'
          assert info['CFBundleVersion'] == os.environ['NUKHAB_BUILD_NUMBER']
          assert os.path.isfile(apps[0] + '/main.jsbundle'), 'Missing embedded JS; release must work without Metro'
          options = {'method': 'app-store-connect', 'destination': 'export',
            'signingStyle': 'manual', 'teamID': os.environ['APPLE_TEAM_ID'],
            'manageAppVersionAndBuildNumber': False,
            'provisioningProfiles': {'sa.nukhab.app.preview': os.environ['PREVIEW_PROFILE']}}
          with open(root + '/PreviewExport.plist', 'wb') as output:
              plistlib.dump(options, output)
          print({key: info[key] for key in ['CFBundleIdentifier', 'CFBundleDisplayName', 'CFBundleVersion']})
          PY
      - name: Export signed preview IPA
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/NukhabPreview.xcarchive" \
            -exportPath "$RUNNER_TEMP/preview-export" -exportOptionsPlist "$RUNNER_TEMP/PreviewExport.plist"
      - name: Upload separate app to TestFlight
        if: ${{ inputs.publish }}
        run: |
          ipa=$(find "$RUNNER_TEMP/preview-export" -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$ipa"
          xcrun altool --upload-app --file "$ipa" --type ios \
            --apiKey "$APPSTORE_API_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"
      - name: Retain signed preview and build diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nukhab-expo-preview-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/preview-export/*.ipa
            ${{ runner.temp }}/preview-archive.log
          if-no-files-found: warn
          retention-days: 7
