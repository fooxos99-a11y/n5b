<!doctype html>
<html lang="ar" dir="rtl">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="%BASE_URL%branding/nukhab/nukhab-logo.svg?v=29" />
		<link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%branding/nukhab/icon-192.png?v=29" />
		<link rel="apple-touch-icon" href="%BASE_URL%branding/nukhab/icon-192.png?v=29" />
		<link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
		<link data-brand-hero-preload rel="preload" href="%BASE_URL%branding/nukhab/nukhab-color-640.webp" imagesrcset="%BASE_URL%branding/nukhab/nukhab-color-320.webp 320w, %BASE_URL%branding/nukhab/nukhab-color-640.webp 640w" imagesizes="min(72vw, 320px)" as="image" type="image/webp" fetchpriority="high" />
		<link rel="preload" href="%BASE_URL%fonts/cairo/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="%BASE_URL%branding/nukhab/nukhab-white-640.webp" as="image" type="image/webp" fetchpriority="high" />
		<meta name="description" content="" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#04433D" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="نخب" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<title>نخب</title>
		<script src="%BASE_URL%theme-bootstrap.js" data-base="%BASE_URL%"></script>
		<link rel="stylesheet" href="/src/styles/loading-spinner.css" />
		<link rel="stylesheet" href="/src/styles/ui-fonts.css" />
		<link rel="stylesheet" href="/src/components/startup/startup.css" />
		<style>
			:root {
				color-scheme: light;
				--boot-bg: #04433d;
			}

			html.dark {
				color-scheme: dark;
				--boot-bg: #04433d;
			}

			html:not(.app-ready),
			html:not(.app-ready) body {
				min-height: 100%;
				overflow: hidden;
				background: var(--boot-bg);
			}

		</style>
	</head>
	<body>
		<div id="root">
			<div id="startup-splash" class="boot-loader startup-splash" style="--startup-background:#04433d;--startup-accent:#f0bd55" dir="rtl" role="status" aria-live="polite" aria-label="جاري التحميل">
				<div class="startup-brand" aria-hidden="true">
					<img class="startup-brand-logo" src="%BASE_URL%branding/nukhab/nukhab-white-640.webp" alt="" fetchpriority="high" />
					<p>برنامج نخب التعليمي</p>
				</div>
				<svg class="startup-pattern" width="100%" height="192" aria-hidden="true">
					<defs><pattern id="startup-pattern" width="96" height="96" patternUnits="userSpaceOnUse">
						<g fill="none" stroke="currentColor" stroke-width="1.2">
							<path d="M48 0 96 48 48 96 0 48Z" />
							<path d="M48 48C22 48 16 28 16 16C28 16 48 22 48 48Z" />
							<path transform="rotate(90 48 48)" d="M48 48C22 48 16 28 16 16C28 16 48 22 48 48Z" />
							<path transform="rotate(180 48 48)" d="M48 48C22 48 16 28 16 16C28 16 48 22 48 48Z" />
							<path transform="rotate(270 48 48)" d="M48 48C22 48 16 28 16 16C28 16 48 22 48 48Z" />
						</g>
					</pattern></defs>
					<rect width="100%" height="100%" fill="url(#startup-pattern)" />
				</svg>
				<div class="startup-recovery" data-startup-recovery hidden>
					<p role="alert">تعذر إكمال التحميل. تحقق من الاتصال ثم أعد المحاولة.</p>
					<button type="button">إعادة المحاولة</button>
				</div>
			</div>
			<div id="app-root" inert aria-hidden="true"></div>
		</div>
		<script src="%BASE_URL%startup-bootstrap.js"></script>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
