<!doctype html>
<html lang="ar" dir="rtl">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="%BASE_URL%branding/nukhab/nukhab-logo.svg?v=29" />
		<link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%branding/nukhab/icon-192.png?v=29" />
		<link rel="apple-touch-icon" href="%BASE_URL%branding/nukhab/icon-192.png?v=29" />
		<link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
		<link data-brand-hero-preload rel="preload" href="%BASE_URL%branding/nukhab/nukhab-color-640.webp" imagesrcset="%BASE_URL%branding/nukhab/nukhab-color-320.webp 320w, %BASE_URL%branding/nukhab/nukhab-color-640.webp 640w" imagesizes="min(72vw, 320px)" as="image" type="image/webp" fetchpriority="high" />
		<link rel="preload" href="%BASE_URL%fonts/cairo/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin />
		<meta name="description" content="" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#04433D" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="نخب" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<title>نخب</title>
		<script src="%BASE_URL%theme-bootstrap.js" data-base="%BASE_URL%"></script>
		<link rel="stylesheet" href="/src/styles/loading-spinner.css" />
		<link rel="stylesheet" href="/src/components/startup/startup.css" />
		<style>
			:root {
				color-scheme: light;
				--boot-bg: #04433d;
			}

			html.dark {
				color-scheme: dark;
				--boot-bg: #04433d;
			}

			html:not(.app-ready),
			html:not(.app-ready) body {
				min-height: 100%;
				overflow: hidden;
				background: var(--boot-bg);
			}

			.boot-loader {
				position: fixed;
				inset: 0;
				z-index: 9999;
				display: grid;
				place-items: center;
				padding: 24px;
				background: var(--boot-bg);
				font-family: var(--font-ui);
			}

			html.dark .boot-loader {
				background: var(--boot-bg);
			}

			.app-ready .boot-loader {
				display: none;
			}

		</style>
	</head>
	<body>
		<div id="root">
			<output class="boot-loader" dir="rtl" aria-live="polite" aria-label="جاري التحميل">
				<span class="loading-logo loading-spinner--screen" aria-hidden="true"></span>
			</output>
			<div id="app-root"></div>
		</div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
